name: ETL Churn Automation

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: 

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Installation de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Installation des dépendances nécessaires
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy kaggle matplotlib seaborn scikit-learn

    # Connexion à Kaggle et téléchargement du dataset
    - name: Download latest data from Kaggle
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        kaggle datasets download -d yeanzc/telco-customer-churn-ibm-dataset --unzip -p data/


    # Lancement de l'ETL et le ML
    - name: Run ETL Script
      run: |
        python "Python_analysis/ETL.py"

    - name: Run ML Script
      run: |
        python "ML_Model/ML.py"